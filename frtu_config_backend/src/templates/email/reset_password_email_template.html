<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
</head>
<body style="margin: 0; padding: 0; background-color: #FFFFFF; font-family: 'GT Walsheim Pro', Arial, sans-serif;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #FFFFFF; padding: 40px 20px;">
        <tr>
            <td align="center">
                <!-- Outer Container -->
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width: 600px; background-color: #D7E8F4; padding: 40px 20px;">
                    <tr>
                        <td align="center">
                            <!-- Inner Card -->
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="352" style="width: 352px; background-color: #FFFFFF; border: 1px solid #D7E8F4; border-radius: 12px; padding: 24px; box-sizing: border-box;">
                                
                                <!-- Logo Section -->
                                <tr>
                                    <td align="center" style="padding-bottom: 20px;">
                                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center">
                                            <tr>
                                                <td style="padding-right: 8px; vertical-align: middle;">
                                                    <img src="images/Frame 12.jpg" alt="Kimbal Logo" width="33" height="32" style="display: block; border: 0;" />
                                                </td>
                                                <td style="vertical-align: middle;">
                                                    <img src="images/Frame 11.jpg" alt="Kimbal" width="92" height="23" style="display: block; border: 0;" />
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <!-- Heading -->
                                <tr>
                                    <td align="center" style="padding-bottom: 20px;">
                                        <h2 style="margin: 0; font-weight: bold; font-size: 18px; line-height: 160%; text-align: center; color: #27272A;">
                                            Reset Your Password
                                        </h2>
                                    </td>
                                </tr>

                                <!-- Message -->
                                <tr>
                                    <td align="center" style="padding-bottom: 20px;">
                                        <p style="margin: 0; font-size: 16px; line-height: 150%; text-align: center; color: #808089;">
                                            We received a request to reset your<br>
                                            RTU Configurator account password.<br>
                                            Click the button below to continue.
                                        </p>
                                    </td>
                                </tr>

                                <!-- Button -->
                                <tr>
                                    <td align="center" style="padding-bottom: 20px;">
                                        <a href="[RESET_LINK]" 
                                           style="display: inline-block; background-color: #1773BE; color: #FFFFFF; padding: 14px 28px; text-decoration: none; border-radius: 8px; font-size: 16px; font-weight: bold;">
                                            Reset Password
                                        </a>
                                    </td>
                                </tr>

                                <!-- Expiry Info -->
                                <tr>
                                    <td align="center" style="padding-bottom: 20px;">
                                        <p style="margin: 0; font-size: 14px; line-height: 150%; text-align: center; color: #808089;">
                                            This link is valid for <b>1 hour</b> only.
                                        </p>
                                    </td>
                                </tr>

                                <!-- Footer Links -->
                                <tr>
                                    <td align="center" style="padding-bottom: 20px; border-top: 1px solid #e0e0e0; padding-top: 20px;">
                                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" style="white-space: nowrap;">
                                            <tr>
                                                <td style="padding: 0 10px;">
                                                    <a href="#" style="color: #666666; text-decoration: none; font-size: 13px;">Terms of Use</a>
                                                </td>
                                                <td style="padding: 0 10px; border-left: 1px solid #e0e0e0;">
                                                    <a href="#" style="color: #666666; text-decoration: none; font-size: 13px;">Privacy Policy</a>
                                                </td>
                                                <td style="padding: 0 10px; border-left: 1px solid #e0e0e0;">
                                                    <a href="#" style="color: #666666; text-decoration: none; font-size: 13px;">Company</a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                            <!-- Disclaimer -->
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="352" style="width: 352px; margin-top: 20px;">
                                <tr>
                                    <td align="center">
                                        <p style="margin: 0; color: #999999; font-size: 12px; line-height: 1.5;">
                                            This is an automated message. Replies are not monitored.
                                        </p>
                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
